id: ROOT
name: GitHub Collaboration Platform Core Requirements
type: FOLDER
dependencies: []
description: >-
  This product is a simplified GitHub collaboration platform. The home page is the starting point for unauthenticated visitors and displays entry points to public organizations and public repositories; after sign-in, the workspace shows the current account, organizations the account belongs to, and accessible repositories in the account menu.
  An “account” is an individual identity that can sign in. The frontend represents it by a username, avatar, or account menu; the system persistently stores the account identifier, username, verified email, credential status, and session ownership. An “organization” is a namespace in which multiple accounts jointly manage resources, rather than an account or repository itself; the frontend presents it through an organization overview page whose title shows the organization name and that contains the Repositories, People, and Teams tabs; the system stores the organization identifier, display name, creator, and “organization-account-Member/Owner” membership relationships. A “team” is a grouping of accounts within an organization; the frontend displays teams on the Teams page and in the team tree, while the system stores the team identifier, owning organization, name, optional parent team, and “team-account” membership relationships.
  A “repository” is a code and collaboration container owned by an individual account or organization; the repository overview page title is “owner/repository name” and contains the Code, Issues, Pull requests, and Settings navigation entries. A repository owned by an organization is called an “organization repository”, whose owner is the organization rather than an individual account; the system stores the repository identifier, owner type and identifier, name, visibility, default branch, description, and creator. Public repositories are readable by visitors; private repositories are readable only by accounts authorized under the defined rules. Organizations, repositories, branches, commits, files, issues, comments, pull requests, reviews, and access grants all belong to explicit parent objects, and the page title or primary area must display the name of the current object.
  A “branch” is a named line of code in a repository that points to a commit; the branch selector on the Code page determines the branch currently being viewed. A “commit” is an immutable record of a file-snapshot change and stores the parent commit, author, message, timestamp, and changed files. An “Issue” is a work item or defect record with a unique number within a repository; its detail page displays the title, description, Open/Closed status, comments, assignees, labels, milestone, and activity timeline. A “Milestone” is an existing goal-classification item in the current repository and is presented in the frontend as selectable metadata on the right side of an issue or PR; the system stores the association between a work item and a milestone and does not create cross-repository associations. A “pull request (PR)” is a proposal to merge changes from the compare branch into the base branch; its detail page displays Conversation, Commits, Files changed, Checks, reviews, and status.
  All write operations must be persisted on the server as objects, relationships, or state records; after refresh, re-login, or opening the relevant page from another account, the same final state must be read; on failure, no partial objects may be created and no partial state may be modified. An organization Owner has Admin permission over the organization and its repositories; a repository Admin has repository-management permission; Read may only view, Triage may view and manage issue/PR metadata, Write additionally may create branches, commit files, create issues/PRs, comment, and review, Maintain additionally may manage labels, milestones, assignees, and review requests, and Admin additionally may manage repository visibility, access grants, and branch protection. Every write operation must first check the current session and target-object permission according to these rules, and successful results must be visible on the relevant detail pages and lists. Real-time collaboration, Actions, Packages, Wiki, project boards, notification delivery, and external Git remote protocols are outside the scope of this product.
children:
- id: REQ-1
  name: Identity and Access
  type: FOLDER
  dependencies: []
  description: This module defines the “account” and “session” required to access the system. An account is a persistent individual identity storing a username, verified email, and credential status; a session is a record created after successful account sign-in that represents only the current browser login state. Visitors enter the account-access page from “Sign up”, “Sign in”, or “Forgot password” on the home page; signed-in users enter security settings or sign out from the account menu. The account menu is the control in the upper-right corner of the page that displays the current signed-in account, organization list, and sign-out entry. No page, error message, or recovery flow may display a full password. After successful sign-in, the account menu displays the current user, and subsequent organization, repository, issue, and pull-request pages use this session to determine visibility and operation permissions; sign-out, password changes, and recovery must immediately change the session state visible to subsequent requests.
  children:
  - id: REQ-1-1
    name: Account Registration and Recovery
    type: FOLDER
    dependencies: []
    description: The account-access page is the shared page used by unauthenticated users to register, sign in, and recover a password, with the frontend showing the appropriate form and submit button for each operation. The local product does not implement an email-verification page, email delivery, or an external verification-code service — successful registration directly stores a sign-in-capable account and marks its email as verified; successful sign-in only stores a new session and does not create a duplicate account; after submitting an email for password recovery, the page directly displays the fixed verification code `123456` and the password-reset form, and only the correct code together with a compliant new password updates the password of the same account. Registration, sign-in, and recovery pages must use visible labels to identify fields and submit actions; after failure, non-sensitive input is retained, while password and password-confirmation fields must not redisplay submitted values.
    children:
    - id: REQ-1-1-1
      name: Register a New GitHub Account
      type: ATOMIC
      dependencies: []
      description: >-
        The registration page is the form opened by “Create an account” from the account-access page; an “account” is the individual record that can subsequently sign in and own organization and repository permissions. The username and email in the form are used together to identify the account, while the password is used only for authentication and must not be echoed on the page. This product directly marks the email of a successfully registered account as verified and does not provide a subsequent email-verification page. The visitor enters a unique username, email, password, and password confirmation in order, checks the terms-agreement checkbox, and clicks “Create account”. The username must consist of 1 to 39 lowercase ASCII letters, digits, or single hyphens (`-`) and must not begin or end with a hyphen; after trimming leading and trailing whitespace, the email must contain exactly one `@`, be no longer than 254 characters, and have at least one dot and non-empty domain labels after the `@`; the password must contain 12 to 128 characters, include at least one uppercase letter, one lowercase letter, one digit, and one non-alphanumeric special character, and contain no whitespace characters. The system stores a sign-in-capable account together with its verified-email status and enters the sign-in page; if the username or email conflicts, any field is missing, the email format is invalid, the terms are not accepted, the password is noncompliant, or the confirmation does not match, the system retains the username and email input, displays an itemized message beside the corresponding field, and does not create an account.
        Visitors can use this capability on the account-access page. The system validates input rules, displays field errors, and prevents duplicate accounts; on success, it directly creates an available account.


        Screenshot reference:

        ![image](reference/github-sign-up.png)
      scenarios:
      - name: Register a New GitHub Account
        steps:
        - keyword: GIVEN
          content: The visitor clicks “Sign in” on the home page to enter the account-access page, then clicks “Create an account”. The registration page displays visibly labeled Username, Email, Password, Confirm password, a terms-agreement checkbox, and the “Create account” button; the current username and email are both unused.
        - keyword: WHEN
          content: The visitor enters a compliant 1–39-character username, a compliant email, a compliant 12–128-character password, and an identical confirmation password, checks the terms-agreement checkbox, and clicks “Create account”.
        - keyword: THEN
          content: The system displays registration success and redirects to the sign-in page without displaying the password; the account's email can now be used for sign-in and password recovery. If the username, email, any required field, terms, or password rules are not satisfied, the system remains on the registration page, displays the reason beside the corresponding field, retains the username and email input, and does not create an account.
        - keyword: THEN
          content: The visitor can immediately sign in with the new account and enter the workspace; after a failed submission, reopening the registration page shows that no new account corresponding to the failed input exists.
    - id: REQ-1-1-2
      name: Sign In with an Existing Account
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-1 (Register a New GitHub Account); it must reuse that context and keep pages and data consistent after the context changes.
        The sign-in page is the form on the account-access page containing “Username or email”, “Password”, and “Sign in”. A “session” is the current-browser login record saved after successful account authentication, represented in the frontend by the upper-right account menu and access to protected pages. The visitor enters a username or email and a password and submits the form. The system looks up the account and validates its credentials and availability status; if authentication fails due to an unknown username/email, incorrect password, or unavailable account, the system displays exactly the same generic failure message, does not disclose whether the account exists or which credential was wrong, and does not create a session. After successful authentication, the system stores a session with a unique session identifier, account identifier, and active status, then redirects to the workspace accessible to that user; the session remains valid after refreshing or reopening the workspace, and subsequent protected organization, repository, and work-item requests must use this session to determine the current user.


        Screenshot reference:

        ![image](reference/github-sign-in.png)
      scenarios:
      - name: Sign In with an Existing Account
        steps:
        - keyword: GIVEN
          content: The visitor enters the account-access page from the home page; a verified and available account exists, and the visitor has the account's username or verified email and current password.
        - keyword: WHEN
          content: The visitor enters the username or verified email in “Username or email”, enters the correct password in “Password”, and clicks “Sign in”.
        - keyword: THEN
          content: The system enters the user's workspace, the account menu displays the username, and the user can access organizations, repositories, and work items they are authorized to view. An unknown account, incorrect password, or unavailable account all produce exactly the same generic failure message, remain on the sign-in page, and do not display the account menu.
        - keyword: THEN
          content: After successful sign-in, refreshing the workspace or directly reopening a previously accessible protected URL still shows the signed-in user; after failed sign-in, refreshing or opening a protected URL still requires authentication.
    - id: REQ-1-1-3
      name: Recover Account Access Through a Verified Email
      type: ATOMIC
      dependencies:
      - REQ-1-1-1
      description: >-
        The password-recovery page is opened by “Forgot password” on the sign-in page; the local system does not send email, generate a copyable reset link, or call an external verification-code service. After the visitor enters an address in the Email field and clicks “Send reset link”, the page directly switches to the next step of the same recovery flow, displays the fixed verification-code text “123456” for local demonstration only, and shows visibly labeled Verification code, New password, Confirm password fields and a “Reset password” button; the page must not require access to email. To prevent disclosure through the page of whether an account exists, both registered and unknown email addresses enter the same next step and display the same fixed verification code. The system atomically updates the credentials of that account only when the recovery context is associated with a registered email, the Verification code is character-for-character equal to “123456”, the new password complies with the password rules in REQ-1-1-1, and Confirm password matches it. If the verification code is wrong, the email is unknown, the password is noncompliant, or the confirmation does not match, the page explains the reason beside the corresponding field and does not modify any account; after successful submission, the page directly displays that the password has been updated and does not produce any email or link. This local verification code has no email-delivery, expiration, or one-time-link semantics. Password fields must not echo entered values.


        Screenshot reference:

        ![image](reference/github-password-reset.png)
        ![image](reference/github-password-reset-1.png)
      scenarios:
      - name: Recover Account Access Through a Verified Email
        steps:
        - keyword: GIVEN
          content: The visitor opens “Forgot password” from the account-access page; one registered account and its email exist, together with another email that corresponds to no account for comparison.
        - keyword: WHEN
          content: The visitor submits the registered email and the unknown email separately; in each directly opened next step, the visitor enters the fixed verification code “123456”, a new password compliant with REQ-1-1-1, and the same confirmation password, then submits.
        - keyword: THEN
          content: Both requests directly display the fixed verification code “123456” and the password-reset form, do not indicate whether the email exists, and do not require access to email or a link. Only the correct-code submission for the registered email updates that account's password and displays a success result; an unknown email, incorrect verification code, noncompliant password, or mismatched confirmation displays the reason and does not modify any account.
        - keyword: THEN
          content: After success, sign-in with the old password fails and sign-in with the new password succeeds; after failure, the old password still works and the candidate new password does not. Refreshing the reset page must not generate an email, link, or second account.
  - id: REQ-1-2
    name: Sign Out and End the Current Web Session
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      “Sign out” in the account menu ends the current browser session without deleting the account, organization membership relationships, or repository data. After a signed-in user clicks this entry, a confirmation dialog explains that sign-out affects only the current session; only clicking confirm invalidates the session, while canceling or closing the dialog must retain the current session. After confirming sign-out, refresh, browser back navigation, or directly reopening a previously accessible protected account, repository, or organization URL must all restore an unauthenticated access state and require re-authentication.


      Screenshot reference:

      ![image](reference/github-account-menu-sign-out.png)
    scenarios:
      - name: Sign Out and End the Current Web Session
        steps:
        - keyword: GIVEN
          content: A signed-in user has entered an organization, repository, or account-settings page they are authorized to access from the account menu and has recorded that protected-page URL.
        - keyword: WHEN
          content: The user opens the account menu and clicks “Sign out”; if a confirmation dialog appears, the user confirms instead of canceling or closing it.
        - keyword: THEN
          content: The system returns to an unauthenticated access state, displays the “Sign in” entry, and no longer displays that user's account menu; if the user cancels the confirmation dialog, the session remains valid and the original page remains accessible.
        - keyword: THEN
          content: When the user refreshes, navigates back in the browser, or directly opens the recorded protected URL, the system requires re-authentication and cannot restore the signed-out session.
  - id: REQ-1-3
    name: Change Account Password
    type: ATOMIC
    dependencies:
    - REQ-1-1-2
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      “Password and authentication” is the security page in account Settings used to change the current account credentials; the change affects only the current account's password record and does not alter any other accounts or resources outside the session. The user must provide the current password, a new password compliant with the REQ-1 password rules, and a character-for-character identical confirmation password; all three fields are required. The system validates the change, prevents unauthorized updates, and applies the new password to subsequent sign-in attempts. If the current password is incorrect, the new password is noncompliant, the confirmation does not match, or any field is missing, the system displays the reason in the corresponding field and does not modify the credentials; the old password remains valid and the new password must not work for sign-in. After a successful update, the new password is immediately used for subsequent password-based sign-ins, and the old password must no longer work for new sign-ins.


      Screenshot reference:

      ![image](reference/github-password-settings.png)
    scenarios:
      - name: Change Account Password
        steps:
        - keyword: GIVEN
          content: A signed-in user enters Settings from the account menu and then opens Password and authentication; the user knows the current password and has prepared a new password different from the current one and compliant with REQ-1-1-1.
        - keyword: WHEN
          content: The user enters the current password, new password, and an identical confirmation in the Current password, New password, and Confirm password fields, then clicks “Update password”.
        - keyword: THEN
          content: The system displays a successful password-updated result. If the current password is incorrect, the new password is noncompliant, the confirmation does not match, or any field is missing, the system displays the reason beside the corresponding field and does not change the password.
        - keyword: THEN
          content: After signing out, the user can sign in with the new password and cannot sign in with the old password; after any failed submission, the old password still works and the candidate new password does not.
- id: REQ-2
  name: Organization and Governance
  type: FOLDER
  dependencies:
  - REQ-1-1-2
  description: Signed-in users enter the organization list through “Your organizations” in the account menu and can create or open an organization; visitors can only view public repositories through public organization pages. The organization overview provides Repositories, People, and Teams entries. An organization Owner directly adds or removes members on People, creates teams and maintains hierarchy on Teams, and grants roles to members or teams in Manage access under repository Settings. Organization membership only determines whether a user can see the organization and can be a candidate for team/repository authorization; it does not automatically grant access to any private repository. Access to a private repository comes only from organization Owner status, a direct role grant on that repository, or direct membership in a team authorized for that repository. All changes must be reflected simultaneously in organization details, people/team lists, and the actual access results of affected repositories.
  children:
  - id: REQ-2-1
    name: Organization Identity and Discovery
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: The organization overview page uses the organization name as its title; the Repositories tab lists repositories owned by the organization, the People tab lists members and their Member/Owner roles, and the Teams tab lists teams. This module supports visitors discovering an organization's public repositories and signed-in accounts creating organizations from the “Your organizations” page. The unique organization name uses the same globally unique 1–39-character lowercase ASCII format as the REQ-1 username; the display name must contain 1–100 non-empty characters after trimming leading and trailing whitespace. After successful creation, the system stores the organization object and the creating account's Owner membership relationship, and the user enters the new organization overview page; subsequent team, member, and organization-repository authorization is scoped by this organization identifier. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-2-1-1
      name: Browse Organization Repositories
      type: ATOMIC
      dependencies: []
      description: >-
        From the organization page, the user clicks the “Repositories” tab, can enter a repository name in the filter box, select a public/private filter, and click a repository name in the list to open its overview. The system displays only the names, descriptions, visibility, and update times of repositories visible to the current user; clicking a result opens that repository's overview.
        Visitors can view public repositories on a public organization overview page; signed-in accounts can see only repositories for which they have read permission on the Repositories tab of the organization overview. The list reads repository name, description, visibility, and update time and provides no write operations; private repositories must first be validated under the already defined repository-access rules.


        Screenshot reference:

        ![image](reference/github-organization-repositories.png)
      scenarios:
      - name: Browse Organization Repositories
        steps:
        - keyword: GIVEN
          content: A visitor has opened the overview page of a public organization, or a signed-in organization member has opened that organization's overview page; the organization contains both a public repository and a private repository that the visitor is not authorized to view.
        - keyword: WHEN
          content: The user clicks the “Repositories” tab, enters the full name of the public repository in the filter box, selects the “Public” filter, and clicks the repository name.
        - keyword: THEN
          content: The list shows only the name, description, visibility, and update time of repositories visible to the current user; the visitor cannot see the private repository name, and clicking the public repository opens the repository overview page titled “organization name/repository name”.
        - keyword: THEN
          content: After returning to the organization page or refreshing it, the filtered results still do not reveal unauthorized repositories; if the visitor directly accesses the private-repository address, the system requires sign-in or displays that access is not permitted.
    - id: REQ-2-1-2
      name: Create an Organization After Authentication
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: A signed-in user enters a unique organization name and display information on the organization-creation page and confirms. The organization name must comply with the 1–39-character lowercase ASCII REQ-1 username format and be globally unique; the display name must contain 1–100 non-empty characters after trimming leading and trailing whitespace. The system validates these rules, creates the organization identifier, display name, and creation time, and saves the current user as both initial owner and member; if the name or display name is noncompliant, the name conflicts, or persistence fails, the system retains non-sensitive input, displays the reason in the corresponding field, and does not create the organization. On success, the user is redirected to the new organization overview page, the organization appears in the current user's accessible-organization list, and subsequent team, member, and repository authorization is scoped by that organization identifier. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Create an Organization After Authentication
        steps:
        - keyword: GIVEN
          content: A signed-in user enters the “Your organizations” page from the account menu and clicks “New organization”; the candidate organization identifier does not exist in the system, and the creation form displays organization-identifier and display-name fields.
        - keyword: WHEN
          content: The user enters an organization identifier that complies with the REQ-1 username format and is globally unique, and a display name whose trimmed length is 1 to 100, then clicks “Create organization”.
        - keyword: THEN
          content: The system enters the new organization overview page, whose title displays the organization identifier; the current user is shown as Owner and organization member, and the organization appears in the “Your organizations” list.
        - keyword: THEN
          content: After refreshing the overview page and reopening the organization list, the organization still exists; if the organization identifier is duplicated, malformed, or the display name is empty, the corresponding field displays the reason and no organization is created.
  - id: REQ-2-2
    name: Team and Member Management
    type: FOLDER
    dependencies:
    - REQ-2-1-2
    description: On the current organization's member- and team-management pages, users create teams, maintain team hierarchy and membership relationships, and directly add or remove organization members. A team name contains 1–50 lowercase ASCII letters, digits, or hyphens, may not begin or end with a hyphen, and must be unique within the same organization; a team must belong to an organization, and a parent team must belong to the same organization and may not create a direct or indirect cycle. Organization membership and team membership are independent persisted relationships; team hierarchy is used only for display and management and does not implicitly add members of a parent or child team to the other team. On the People page, an Owner enters the username or verified email of an existing account and confirms, after which the system immediately saves that account's Member or Owner membership relationship; there is no invitation, Pending, or acceptance step. When removing a member, the system atomically deletes that organization-membership relationship, all of that account's team memberships in the organization, and all direct grants to that account on repositories of the organization; team grants themselves are not deleted. If removal would leave the organization with no Owner, the system rejects the operation and keeps all relationships unchanged; the person's account, personal repositories, and relationships with other organizations must not be deleted. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-1-2 (Create an Organization After Authentication); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-2-2-1
      name: Create an Organization Team
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: A team page is the detail page for a grouping of accounts within an organization, titled “organization name/team name”; the Members tab displays the team's direct members, and Settings is used to change the parent team. Only an organization Owner can click “New team” from the Teams tab on the organization overview. The system stores the team identifier, owning organization, name, optional description, optional parent team, creator, and timestamp; if the organization name is missing, malformed, duplicated, the parent team does not belong to the current organization, or creation fails, no team is generated. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-1-2 (Create an Organization After Authentication); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Create an Organization Team
        steps:
        - keyword: GIVEN
          content: An organization Owner is signed in and has opened “Teams” from the organization overview page; the organization may already contain a parent team, and the target team name is not yet used in that organization.
        - keyword: WHEN
          content: The Owner clicks “New team”, enters a team name 1 to 50 characters long containing only lowercase ASCII letters, digits, or hyphens and not beginning or ending with a hyphen, optionally enters a description and a parent team from the same organization, then clicks “Create team”.
        - keyword: THEN
          content: The system redirects to the new team page, whose title displays “organization name/team name”; the team tree displays its organization and selected parent team. If the name is empty, malformed, duplicated, or the parent team does not belong to the organization, an error is displayed and no team is created.
        - keyword: THEN
          content: After refreshing the team page or reopening the “Teams” list, the new team and its parent-child relationship remain consistent.
    - id: REQ-2-2-2
      name: Manage Organization Team Members and Hierarchy
      type: ATOMIC
      dependencies:
      - REQ-2-2-1
      description: Only an organization Owner may maintain members or hierarchy on an organization team page. On the team page, the Owner clicks “Members” to add or remove current organization members, or selects a new parent team in “Settings” and saves. The system stores the team-membership relationship or team hierarchy and immediately reflects it in the organization team tree and member list; team hierarchy creates no implicit membership relationship or repository permission, and cyclic hierarchy is prohibited. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-2-1 (Create an Organization Team); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Manage Organization Team Members and Hierarchy
        steps:
        - keyword: GIVEN
          content: A signed-in team maintainer opens a team page within an organization; there is an organization member who has not yet joined the team and a candidate parent team in the same organization that would not create a cycle.
        - keyword: WHEN
          content: On the “Members” page, the maintainer uses “Add member” to precisely search for and add that organization member, then selects the candidate parent team in “Settings” and saves; the maintainer subsequently removes the just-added member from the member action menu.
        - keyword: THEN
          content: After addition, the member list displays the account; after saving, the team tree displays the new parent-child relationship; after removal, the account no longer appears in the member list. Non-organization members cannot be added, and any selection that would make the team its own parent or the parent of one of its ancestors is rejected.
        - keyword: THEN
          content: After refreshing the member page and organization team tree, the page displays only successfully saved parent-team and membership relationships.
      - name: Reject Setting a Descendant Team as the Parent Team
        steps:
        - keyword: GIVEN
          content: A team maintainer opens an organization team that already has a parent team.
        - keyword: WHEN
          content: The maintainer selects one of that team's descendant teams as the new parent team and saves.
        - keyword: THEN
          content: The system rejects the cyclic relationship, keeps the original parent team unchanged, and continues to display the original hierarchy after reload.
    - id: REQ-2-2-3
      name: Directly Add a User as an Organization Member
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: On the “People” page, an organization Owner clicks “Add member”, enters the username or verified email of an existing account, selects “Member” or “Owner”, and clicks “Add member”. The system atomically stores the “organization-account-role” membership relationship and immediately displays the organization in both the People list and the target account's “Your organizations” list; the target account can see the organization on its next sign-in, after refreshing the workspace, or after reopening the organization URL. A Member gains only organization visibility and eligibility to become a candidate for team/repository authorization; an Owner additionally gains Admin permission over the organization and its repositories. For an existing member, unknown account, unsupported role, or persistence failure, the system displays the reason and does not change the membership relationship. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-1-2 (Create an Organization After Authentication); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Directly Add a User as an Organization Member
        steps:
        - keyword: GIVEN
          content: An organization Owner is signed in and has opened the organization's “People” page; the system contains a registered account that is not yet a member of the organization and can subsequently sign in independently.
        - keyword: WHEN
          content: The Owner clicks “Add member”, enters that account's username or verified email, selects “Member”, and clicks “Add member”.
        - keyword: THEN
          content: The “People” page immediately displays the account with the Member role and no Pending state; after that account signs in, both “Your organizations” in the account menu and the organization overview display the organization, but the account has not gained access to any private repository that was not separately authorized.
        - keyword: THEN
          content: After the Owner refreshes the “People” page and the target account signs in and refreshes the “Your organizations” page, both read the same membership relationship; an existing member, unknown account, unsupported role, or persistence failure does not create a duplicate membership relationship.
    - id: REQ-2-2-4
      name: Remove a Member from an Organization
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: On the “People” page, an organization Owner locates a member, clicks “Remove from organization” in that member's action menu, and clicks “Remove” in the confirmation dialog. The system atomically deletes that member's organization-membership relationship, all of the account's memberships in teams of that organization, and all direct grants to that account on repositories of the organization; if the account still obtains repository permission through another organization Owner status or an undeleted team grant, effective permission is recalculated according to the valid permission rules, otherwise access is denied. The system must not delete the personal account, personal repositories, relationships with other organizations, teams themselves, or team grants; the last Owner must not be removed. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-1-2 (Create an Organization After Authentication); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Remove a Member from an Organization
        steps:
        - keyword: GIVEN
          content: An organization Owner is signed in and has opened the organization's “People” page; the list contains a member who also has an accessible personal account and personal repository.
        - keyword: WHEN
          content: The Owner locates the row by the member's username, clicks “Remove from organization” in the action menu, and clicks “Remove” in the confirmation dialog.
        - keyword: THEN
          content: The system removes the account from the organization-member list and revokes access obtained solely through that organization membership; direct access by the account to private organization resources is denied.
        - keyword: THEN
          content: After refreshing the “People” page, the account is still absent from the member list; after signing in with that account, the personal account and personal repository still exist and remain accessible.
      - name: Prevent a Non-Owner from Removing an Organization Member
        steps:
        - keyword: GIVEN
          content: A signed-in user who is not an organization Owner opens the organization's People page and can see a member.
        - keyword: WHEN
          content: The user opens the member action menu and attempts to remove that member.
        - keyword: THEN
          content: The removal operation is unavailable to the non-Owner or is rejected, and after reload the member still belongs to the organization.
  - id: REQ-2-3
    name: Grant Repository Access to People and Teams
    type: ATOMIC
    dependencies:
    - REQ-2-1-2
    - REQ-2-2-1
    description: An organization Owner or repository Admin may grant a repository role of Read, Triage, Write, Maintain, or Admin to a current organization member or team. A private repository is accessible only to an organization Owner, a member with a direct repository role, or a direct member of a team that has a repository role; an ordinary organization Member has no default private-repository access. For a given subject and repository, only one direct role grant is stored — saving the same role again does not create a second record, and changing the role replaces the original role. An account's effective repository role is the highest among Admin from Owner status and all still-valid direct grants and team grants; team hierarchy does not propagate membership or authorization. The system stores the authorization subject, repository, role, grantor, and timestamp and authorizes operations according to the ROOT role matrix; unauthorized accounts cannot see private repositories. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-2-1-2 (Create an Organization After Authentication) and REQ-2-2-1 (Create an Organization Team); it must reuse that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: Grant Repository Access to People and Teams
      steps:
      - keyword: GIVEN
        content: An organization Owner or repository Admin is signed in and has opened the “Manage access” page of a private organization repository; the organization contains one member and one team, neither of which currently has a direct grant on that repository.
      - keyword: WHEN
        content: The administrator selects the member or team, selects the “Write” role, and clicks “Add” or “Save”.
      - keyword: THEN
        content: The authorization list displays exactly one “Write” role record for that subject; when the member or a member of the team opens the repository, they can view repository content and perform operations allowed by the Write role, while accounts that were not granted permission do not gain that access.
      - keyword: THEN
        content: After refreshing the “Manage access” page, the grant still exists; saving the same role again for the same subject does not generate a second authorization record.
    - name: Replace an Existing Repository Grant Instead of Creating a Duplicate
      steps:
      - keyword: GIVEN
        content: An administrator opens a repository-access management page where a grant has already been saved for a team.
      - keyword: WHEN
        content: The administrator changes that team's role to another level and saves the update.
      - keyword: THEN
        content: The system retains only one team-authorization record, replaces the old role with the new role, and displays the updated grant after reload.
- id: REQ-3
  name: Repository Asset Management
  type: FOLDER
  dependencies: []
  description: A repository is a container for code, branches, commits, files, and collaborative work items. The repository overview page is titled “owner/repository name”, displays the owner, name, Public/Private marker, description, and default branch, and provides Code, Issues, Pull requests, and Settings entries; the “owner” is an individual account or organization, and a repository belonging to an organization is an organization repository. Users open a repository overview from global search results, a personal/organization Repositories list, or a direct link; signed-in users with creation permission create a personal or organization repository from “New repository”. Public repositories allow visitor Read access; private personal repositories allow access only to their owner and explicitly authorized subjects; private organization repositories allow access only to organization Owners, members with direct repository roles, or direct members of teams with repository roles, and ordinary organization Members do not automatically gain access merely through membership. After visibility or access grants change, search, lists, direct links, and repository pages must all use the same access rule.
  children:
  - id: REQ-3-1
    name: Search for and Locate Repositories
    type: ATOMIC
    dependencies: []
    description: >-
      Visitors or signed-in users can search repositories they are authorized to view. The system accepts a search query, applies repository-oriented filters or scope constraints, and displays matching repositories with sufficient metadata for the user to open the target repository.


      Screenshot reference:

      ![image](reference/github-repository-search-results.png)
    scenarios:
    - name: Search for and Locate Repositories
      steps:
      - keyword: GIVEN
        content: The user is on any page; the system contains a public repository whose name includes a unique keyword and a private repository whose name includes the same keyword but which the user is not authorized to view.
      - keyword: WHEN
        content: The user enters the unique keyword in the top global search box and presses Enter, selects the “Repositories” type filter on the results page, then clicks the public repository's name.
      - keyword: THEN
        content: The results page displays the public matching repository's “owner/repository name”, description, visibility, and update time, and does not display the unauthorized private repository; clicking the result opens the target repository overview page.
      - keyword: THEN
        content: After clearing the search term or switching to a non-matching filter, the results page does not retain old results; directly accessing the unauthorized private-repository address still requires authentication or denies access.
  - id: REQ-3-2
    name: Repository Creation and Distribution
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: The repository-creation page is the form opened by “New repository”, where the user selects an owner, name, visibility, and initialization options. A “fork” is an independent repository copied from a readable source repository — the frontend displays the source link on the fork overview page, and the system stores the source-repository identifier; branches and commits in the fork may evolve independently and never write back to the source repository. A “clone URL” is a read-only address displayed in the repository Code popover and can be copied to the clipboard; it does not mean this product implements an external Git protocol. Both new repositories and forks must enter a browsable repository overview page. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-3-2-1
      name: Create a Repository with Owner, Visibility, and Initialization Options
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        On the repository-creation page, a signed-in user selects a personal or organization owner, enters a repository name and description, selects public or private visibility, and chooses whether to create an initial commit with a README. The system verifies that the user may create a repository in that owner's namespace, that the name is unique, and that the options are valid; on success, it stores the repository identifier, owner, visibility, default branch, and creator. If initialization is selected, it must also atomically create the initial branch, README file, and initial commit; failure at any step must leave no partially created repository. On success, the new repository overview page is opened.


        Screenshot reference:

        ![image](reference/github-create-repository.png)
      scenarios:
      - name: Create a Repository with Owner, Visibility, and Initialization Options
        steps:
        - keyword: GIVEN
          content: A signed-in user opens the creation page from “New repository”; the personal namespace is selectable. If an organization namespace is selected, the user has permission to create repositories for that organization, and the candidate repository name is unused in the target namespace.
        - keyword: WHEN
          content: The user selects the target owner, enters a valid and unique repository name and optional description, selects “Private”, checks “Add a README file”, and clicks “Create repository”.
        - keyword: THEN
          content: The system enters the “owner/repository name” overview page, marked Private; the default branch contains a README file, and the commit history contains one initialization commit; the repository also appears in the target owner's repository list.
        - keyword: THEN
          content: After refreshing the overview page, the owner, visibility, README, and initialization commit remain; if the name is empty or duplicated, the user lacks organization-creation permission, or any step fails during creation, the system displays the reason and leaves no partially created repository.
    - id: REQ-3-2-2
      name: Fork a Repository into Another Namespace
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >-
        On the source repository page, the user clicks “Fork”, selects a target personal or organization namespace, enters an optional new name and visibility, and clicks “Create fork”. The system creates an independent fork, copies the accessible default-branch history, records the source-repository link, and then opens the new fork overview page.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        A signed-in user can fork only when they have Read or higher permission on the source repository and permission to create repositories in the target personal or organization namespace; when the source repository is private, the fork must remain Private, while a public source repository may be forked as Public or Private. The system validates permissions on both ends and stores the new fork's owner, visibility, source-repository identifier, default branch, and copied accessible history; if any check fails, no fork is created.


        Screenshot reference:

        ![image](reference/github-fork-repository.png)
      scenarios:
      - name: Fork a Repository into Another Namespace
        steps:
        - keyword: GIVEN
          content: A signed-in user opens an accessible source-repository overview page; the user can select a personal namespace or an organization namespace in which they have creation permission, and no same-named fork exists in the target namespace.
        - keyword: WHEN
          content: The user clicks “Fork”, selects the target namespace, keeps or enters a valid new repository name and optional visibility, then clicks “Create fork”.
        - keyword: THEN
          content: The system opens the target “owner/fork name” overview page, which displays the source repository of the fork; the default branch contains the accessible history and files from the source repository, and subsequent commits to the fork do not modify the source repository.
        - keyword: THEN
          content: After refreshing the fork page and target owner's repository list, the fork and source link still exist; if the target name conflicts, the user lacks permission in the target namespace, or the source repository is inaccessible, no fork is created.
    - id: REQ-3-2-3
      name: Copy a Repository Clone URL
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        On the repository overview page, the user clicks “Code”, selects the HTTPS or SSH clone method, and then clicks the copy icon to the right of the URL. The system writes the selected clone URL to the browser clipboard and displays brief “Copied” feedback; this read-only operation does not modify the repository.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.
        Visitors or signed-in users may use this capability on a repository page. This capability requires the target public object to be available or the user to have view permission. The system verifies eligibility, displays any required warning or unavailable state, and prevents unauthorized changes. The selected repository-access value can be pasted by the user into a local tool.


        Screenshot reference:

        ![image](reference/github-code-clone-menu.png)
      scenarios:
      - name: Copy a Repository Clone URL
        steps:
        - keyword: GIVEN
          content: The user has opened a public repository, or is signed in and has opened the overview page of a private repository they are permitted to view; the browser allows the page to write to the clipboard.
        - keyword: WHEN
          content: The user clicks “Code”, selects the “HTTPS” or “SSH” tab, and clicks the copy icon to the right of the corresponding clone URL.
        - keyword: THEN
          content: The clipboard content equals the complete clone URL for the currently selected protocol, and brief “Copied” feedback appears near the button; repository files, commit history, and visibility remain unchanged.
        - keyword: THEN
          content: After closing and reopening the menu, the correct URL for the same repository is still displayed; a user without access to a private repository cannot enter that page or obtain its clone URL.
  - id: REQ-3-3
    name: View a Public Repository Overview
    type: ATOMIC
    dependencies: []
    description: >-
      Visitors or authorized users can open a repository overview to confirm repository identity, visibility, description, primary metadata, and available content. The overview provides the primary entry points for browsing files, viewing repository context, and beginning collaboration.


      Screenshot reference:

      ![image](reference/github-repository-overview.png)
    scenarios:
    - name: View a Public Repository Overview
      steps:
      - keyword: GIVEN
        content: A visitor has a search result, personal/organization repository-list item, or direct address for a public repository; the repository has a description, default branch, and at least one file.
      - keyword: WHEN
        content: The visitor clicks the repository name or directly opens the repository address.
      - keyword: THEN
        content: The overview page displays “owner/repository name”, the Public marker, description, default branch, and file list, and provides entries such as “Code”, “Issues”, and “Pull requests”; the visitor can click a file name to enter the file-content page.
      - keyword: THEN
        content: After refreshing or reopening through the same address, the same repository state is still displayed; if the address is replaced with that of a private repository for which the visitor has no authorization, its content is not shown to the visitor.
  - id: REQ-3-4
    name: Change Repository Visibility with Permission Checks
    type: ATOMIC
    dependencies:
    - REQ-3-3
    - REQ-1-1-2
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      A repository administrator changes repository visibility after reviewing the impact on access permissions. The system blocks unauthorized changes, applies the selected visibility, and enforces the updated access rules when users subsequently open the repository.


      Screenshot reference:

      ![image](reference/github-repository-visibility-settings.png)
    scenarios:
    - name: Change Repository Visibility with Permission Checks
      steps:
      - keyword: GIVEN
        content: A repository Admin is signed in and has opened the overview page of a repository that is currently Private; there is also an unauthenticated visitor, and the repository already contains files and a description suitable for public display.
      - keyword: WHEN
        content: The Admin enters “Settings” → “General” → “Danger Zone”, selects changing visibility to Public, clicks “Change visibility”, enters the full repository name as required by the page in the confirmation dialog, and confirms.
      - keyword: THEN
        content: The system displays the Public marker on the repository overview page; after the visitor refreshes, the visitor can view repository content from the direct address, and search and repository lists also display the repository according to the public-access rules.
      - keyword: THEN
        content: After refreshing the settings page, visibility remains Public; a non-Admin either does not see an actionable visibility-change entry or has the submission rejected, and if the confirmation text does not match, visibility remains Private.
- id: REQ-4
  name: Code and Version Control
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: The Code page is the main page for browsing code in a repository — the top of the page displays the current branch selector, the main area displays files and directories at the current path on the current branch, clicking a file opens a read-only file page, and clicking Commits opens commit history. A file is content at a path on a branch; a directory is only a path hierarchy used for organization and is not an independent collaboration object. A branch is a named reference pointing to a commit, and switching branches only changes the file snapshot read by the current page. A commit is an immutable change record that stores the parent commit, author, message, time, and changed files; users with Write, Maintain, Admin, or organization Owner permission can create new commits from a file page through Edit or Add file. Every file, commit, comparison, and branch page displays the repository and current branch or revision. Editing a file must create a new commit and must not rewrite historical content.
  children:
  - id: REQ-4-1
    name: Browse Repository Files and Directories
    type: ATOMIC
    dependencies:
    - REQ-3-3
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.
      Any user with repository-view permission can browse directories and files on the selected branch from the Code page; a directory page displays the current path, while a file page reads the stored content, most recent commit, and file name for that branch and path without creating file changes.


      Screenshot reference:

      ![image](reference/github-code-file-browser.png)
    scenarios:
    - name: Browse Repository Files and Directories
      steps:
      - keyword: GIVEN
        content: The user has opened the “Code” page of an accessible repository; the current branch contains files in the root directory, a nested directory, and a text file inside that directory.
      - keyword: WHEN
        content: The user clicks the nested-directory name and then clicks the text-file name inside it.
      - keyword: THEN
        content: The directory page displays the current branch, path breadcrumbs, and the file list for that directory; the file page displays the full path, current branch, and readable file content, and the breadcrumbs can return to the parent directory.
      - keyword: THEN
        content: After switching to another branch that does not contain the file, the file is not displayed; refreshing the current file page does not modify file content or the branch.
  - id: REQ-4-2
    name: Commit History and Code Search
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: The “commit history” page displays commit records for a branch or file path in reverse chronological order; the “diff” page compares the file contents of two commits or revisions line by line, where base is the earlier or target revision and compare is the newer or to-be-compared revision; the “code search” page searches for keywords only within readable file content in the current repository. All three are read-only views that do not create commits or modify files or branches and follow repository visibility and access permissions. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-4-2-1
      name: View Repository Commit History
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes.
        Any user with repository-view permission can read branch history on the Commits page, or from a file page read only the history that modified that file; each record references the stored commit identifier, author, time, message, parent commit, and changed files.


        Screenshot reference:

        ![image](reference/github-commit-history.png)
      scenarios:
      - name: View Repository Commit History
        steps:
        - keyword: GIVEN
          content: The user has opened the default branch of an accessible repository; the branch contains at least two commits, and the later commit modified a known file.
        - keyword: WHEN
          content: The user clicks the commit-count link above the file list or “Commits”, then selects the history scope for the known file.
        - keyword: THEN
          content: The history page displays commits within that scope with the newest first; each item shows the short hash, commit message, author, and time, and the file-scoped history does not display commits that did not modify that file.
        - keyword: THEN
          content: After clicking any commit to enter its detail page, the corresponding parent revision and changed files remain visible; refreshing the history page does not change commit order or content.
    - id: REQ-4-2-2
      name: Inspect Commit and Revision Differences
      type: ATOMIC
      dependencies:
      - REQ-4-2-1
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-2-1 (View Repository Commit History); it must reuse that context and keep pages and data consistent after the context changes.
        Any user with repository-view permission can compare two readable commits or revisions on the diff page; the page reads and displays the changed files and line-by-line additions and deletions between them without creating a review, comment, or commit.


        Screenshot reference:

        ![image](reference/github-commit-diff.png)
      scenarios:
      - name: Inspect Commit and Revision Differences
        steps:
        - keyword: GIVEN
          content: The user has opened commit history for an accessible repository; there is a commit containing added and modified files, and its parent commit is accessible.
        - keyword: WHEN
          content: The user clicks the short hash of that commit, or selects its parent commit as base and that commit as compare on the comparison page and clicks “Compare”.
        - keyword: THEN
          content: The diff page displays the base and compare identifiers, the list of changed files, and added/deleted lines for each file; clicking a changed file navigates to that file's diff, and unchanged files do not appear in the list.
        - keyword: THEN
          content: Refreshing or returning to commit history does not cause the read-only comparison to modify repository branches, commits, or files; if the user lacks permission to view either revision, its diff content is not displayed.
    - id: REQ-4-2-3
      name: Search Code Within a Repository
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        The user enters a code keyword in the search box at the top of the repository page and presses Enter, selects the “Code” results page, can further filter by path or language, and clicks a matching file. The system displays matching snippets, file paths, and branch/revision context within the visible code scope of the current repository; clicking a result opens the corresponding file location.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes.
        Visitors can search from the Code page of a public repository, while signed-in accounts can search any repository they are authorized to view; the results page only reads file content, matching snippets, and paths from currently visible branches of the current repository and cannot leak results across repositories or write code.


        Screenshot reference:

        ![image](reference/github-repository-code-search.png)
      scenarios:
      - name: Search Code Within a Repository
        steps:
        - keyword: GIVEN
          content: The user has opened an accessible repository; two files on the default branch contain a unique code term, one under the `src/` path, and an unauthorized private repository also contains the term.
        - keyword: WHEN
          content: The user enters the unique code term in the search box at the top of the repository page and presses Enter, selects the “Code” result type, then limits the path filter to `src/` and clicks a matching file.
        - keyword: THEN
          content: The results page lists only matching files in the current repository and under `src/`, displaying the matching snippet, file path, and branch or revision context; clicking a result opens the file near the match.
        - keyword: THEN
          content: After clearing the path filter, the user can see other matching files in the current repository but no content from unauthorized private repositories; the search does not create commits or change files.
      - name: Show an Empty State When Code Search Has No Matches
        steps:
        - keyword: GIVEN
          content: The user has already selected repository scope on the repository code-search page.
        - keyword: WHEN
          content: The user enters a query that matches no code and opens the Code results view.
        - keyword: THEN
          content: The system displays an empty-results state, keeps the repository scope and filters unchanged, and does not open any file.
  - id: REQ-4-3
    name: Branch Management
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: The branch selector is the control at the top of the Code page that lists and switches branches; the system stores a unique name and current pointed-to commit for each branch. Creating a branch creates a new named reference at a specified base commit; it does not copy files or rewrite base history. The default branch is the branch read by default when opening the repository overview or a URL without a specified branch; it is not the only existing or writable branch. A branch name is 1–255 characters and may contain only ASCII letters, digits, `-`, `_`, `.`, and `/`; it must not end with `/` or `.`, and must not contain consecutive `..` or `//`; duplicate names, invalid names, or lack of permission must prevent branch creation. Changing the default branch must not alter existing branches, commits, or source/target references of already-open PRs. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-4-3-1
      name: List and Switch Repository Branches
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes.
        Any user with repository-view permission can use the branch selector at the top of the Code page to list and switch branches; the “current branch” is the branch jointly referenced by the selector, URL, and file list, not an additionally persisted user setting.


        Screenshot reference:

        ![image](reference/github-branch-selector.png)
      scenarios:
      - name: List and Switch Repository Branches
        steps:
        - keyword: GIVEN
          content: The user has opened the `main` branch of an accessible repository; the repository also contains a `feature/login` branch, and the two branches differ in the content of a known file.
        - keyword: WHEN
          content: The user opens the branch selector currently showing `main`, enters `feature/login`, and clicks that branch name.
        - keyword: THEN
          content: The page URL, branch selector, and file list all switch to `feature/login`, and the known file displays the content from that branch; the selector can list both `main` and the target branch and marks the current branch.
        - keyword: THEN
          content: Selecting `main` again restores its file content; switching branches does not create a commit or change either branch head.
      - name: Keep the Current Active Branch When There Is No Match
        steps:
        - keyword: GIVEN
          content: A user with repository-view permission has opened the branch selector on the Code page, and the selector currently displays an existing branch.
        - keyword: WHEN
          content: The participant enters a branch query with no matching result.
        - keyword: THEN
          content: The system displays an empty branch-search state and retains the current active branch after the selector is closed or the page is reloaded.
    - id: REQ-4-3-2
      name: Create a Branch from an Existing Revision
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        The user opens the branch selector, enters a new branch name, confirms the displayed base branch or commit, and clicks “Create branch: <name>”. The system creates a new branch pointing to that base commit and switches the selector to it; if the name already exists or the user lacks permission, no branch is created.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        Only signed-in users with Write, Maintain, Admin, or organization Owner status may create branches on repository code and version-control pages; Read and Triage may only browse. The system validates the role, stores the new branch name, base commit, creator, and time, and rejects unauthorized requests.


        Screenshot reference:

        ![image](reference/github-create-branch.png)
      scenarios:
      - name: Create a Branch from an Existing Revision
        steps:
        - keyword: GIVEN
          content: A signed-in user with write permission has opened the repository's `main` branch; the current branch-head commit is known, and the target name `feature/api-v2` does not exist.
        - keyword: WHEN
          content: 'The user opens the branch selector, enters `feature/api-v2`, confirms that the base is the current `main` branch-head commit, and clicks “Create branch: feature/api-v2”.'
        - keyword: THEN
          content: The system creates the branch and switches the browsing context to it; the initial commit in the branch details matches the original `main` branch head, and the original branch history and files are not rewritten.
        - keyword: THEN
          content: After refreshing the branch list, the new branch still exists; if the name is empty, contains invalid characters, ends with `/` or `.`, contains `..` or `//`, duplicates an existing name, or the user lacks write permission, an error is displayed and no branch is created.
    - id: REQ-4-3-3
      name: Change the Repository Default Branch
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        A repository administrator enters “Settings” → “Branches”, selects an existing branch from the “Default branch” dropdown, clicks “Update”, and then confirms the change. The system saves the new default branch and updates the initial branch shown when the repository is newly opened; it does not delete or rewrite the previous default branch.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        Only a repository Admin or organization Owner may change the default branch on repository code and version-control pages; other roles may only view. The system validates the role, stores the new default branch together with the operator and time, and rejects unauthorized requests.


        Screenshot reference:

        ![image](reference/github-default-branch-settings.png)
      scenarios:
      - name: Change the Repository Default Branch
        steps:
        - keyword: GIVEN
          content: A repository Admin is signed in; the repository already has `main` and `release` branches, the current default branch is `main`, and both branches retain their respective commit histories.
        - keyword: WHEN
          content: The Admin enters “Settings” → “Branches”, selects `release` from the “Default branch” dropdown, clicks “Update”, and confirms in the confirmation dialog.
        - keyword: THEN
          content: The system saves `release` as the default branch; newly opening the repository overview displays `release` by default, while the `main` branch and its commits remain available in the selector.
        - keyword: THEN
          content: After refreshing the settings page, the default branch is still `release`; only existing branches can be selected, and for a non-Admin the update entry is unavailable or the request is rejected with the default branch unchanged.
      - name: Prevent a Non-Administrator from Changing the Default Branch
        steps:
        - keyword: GIVEN
          content: A signed-in user without repository-administration permission opens the Branches page in repository settings.
        - keyword: WHEN
          content: The user attempts to view or update the default-branch setting.
        - keyword: THEN
          content: The default-branch update operation is unavailable to the non-administrator or is rejected, and the saved default branch remains unchanged.
  - id: REQ-4-4
    name: Manage Repository Files Through the Web Interface
    type: ATOMIC
    dependencies:
    - REQ-4-1
    - REQ-1-1-2
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      The file editor is the form opened from Edit or Add file on the Code page; the user edits file content at a path on the current branch and submits it. Only Write, Maintain, Admin, or organization Owner may submit; Read and Triage may only view. A single submission stores the file-path and content change, commit message, author, parent commit, and target branch as one indivisible record and moves the target branch to point to that new commit. A new or renamed file path must not be empty, must not begin with `/`, must not contain a `..` path segment, and must not conflict with an existing file or directory on the current branch; the commit message must contain 1–72 non-empty characters after trimming leading and trailing whitespace. If the path conflicts, content validation fails, the commit message is noncompliant, the branch is protected, or persistence fails, the page displays the reason and does not change the file, branch head, or commit history.


      Screenshot reference:

      ![image](reference/github-web-file-editor.png)
    scenarios:
    - name: Manage Repository Files Through the Web Interface
      steps:
      - keyword: GIVEN
        content: A signed-in contributor opens the file-browser page on an unprotected branch of a writable repository; the branch-head commit is known, and the target new file path `docs/guide.md` does not yet exist.
      - keyword: WHEN
        content: The user clicks “Add file” → “Create new file”, enters the path `docs/guide.md` and file content, enters a commit message whose trimmed length is 1 to 72, and clicks “Commit changes”.
      - keyword: THEN
        content: The system creates a new commit whose parent is the original branch head; the commit details record the author, message, and newly added path; the branch head is updated to the new commit, and the file-browser page displays the new file and its content.
      - keyword: THEN
        content: After refreshing the file page and commit history, the new file and commit still exist; if the path is empty, begins with `/`, contains `..`, conflicts with an existing file, the commit message is noncompliant, the branch is protected, or persistence fails, the system displays the reason and leaves the file, branch head, and history unchanged.
- id: REQ-5
  name: Work Planning and Issue Management
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: An issue is a persistent work item within a repository used to record pending work, a defect, or a discussion topic; it is not a code file or PR. The Issues page is the list page in repository navigation; each row displays the issue number, title, Open/Closed status, author, and labels, and clicking the number or title opens the issue detail page. At the top of the detail page are the title and status; the right side displays Assignees, Labels, and Milestone metadata in order; the main area displays the description, comments, and activity timeline. The “activity timeline” is an append-only history that records creation, edits, comments, assignment, labels, milestone, and status changes in chronological order. A label is a pre-existing colored classification name in the current repository; a milestone is a pre-existing goal-classification item in the current repository that may be associated with multiple issues or PRs but does not change their content or status. Write, Maintain, and Admin may create issues, edit titles/descriptions, and comment; Triage, Maintain, and Admin may assign participants, apply labels, set milestones, and close or reopen issues; Read may only view. Every operation is performed around a unique issue number within the repository, and the detail page and list display the same persisted data; after refresh, re-login, or opening from another account with view permission, the same record is still read.
  children:
  - id: REQ-5-1
    name: Issue Discovery and Details
    type: FOLDER
    dependencies:
    - REQ-3-3
    description: The Issues list page displays issues within the current repository; status, keyword, and label filters only change the rows currently displayed in the browser and do not write or delete issues. The issue detail page is the complete view of the work item with the same number, aggregating the description, right-side metadata, comments, and activity timeline, and also serves as the common entry point for editing, commenting, assigning, labeling, setting milestones, and closing/reopening. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-5-1-1
      name: List and Filter Repository Issues
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.
        Users with repository-view permission can read issue rows for the current repository on the Issues list page; each row references a persisted issue number and displays the title, status, author, labels, and update time. Users can filter by Open/Closed, title or body keywords, and labels; filtering does not create or modify work items.


        Screenshot reference:

        ![image](reference/github-issues-list.png)
      scenarios:
      - name: List and Filter Repository Issues
        steps:
        - keyword: GIVEN
          content: The user has opened the “Issues” page of an accessible repository; the list contains an Open issue with the `bug` label and a unique word in its title, and a Closed issue with the same label.
        - keyword: WHEN
          content: The user selects “Open”, enters the unique word, and selects `bug` in the label filter.
        - keyword: THEN
          content: The list displays only the matching Open issue, and each row displays its number, title, label, author, and status; clicking the title opens that issue's detail page.
        - keyword: THEN
          content: After switching to “Closed”, the Open issue is not shown and the matching Closed issue is shown; filtering only changes list display and does not change any issue data.
      - name: Filter Only Closed Issues
        steps:
        - keyword: GIVEN
          content: A user with repository-view permission is viewing rows containing both Open and Closed issues on the current repository's Issues list page.
        - keyword: WHEN
          content: The participant switches to the Closed-status filter and searches for the title of a closed issue.
        - keyword: THEN
          content: The system displays only the matching closed issue and keeps issue data unchanged after reload.
    - id: REQ-5-1-2
      name: View an Issue and Its Discussion
      type: ATOMIC
      dependencies:
      - REQ-5-1-1
      description: An issue detail page is the read view for a uniquely numbered work item within a repository — the top displays the number, title, and Open/Closed status; the body displays the description; the right side displays assignees, labels, and milestone; and the bottom displays comments and activity records over time. Any user with repository-view permission may read this saved data, but the page displays editable controls only to users with the corresponding role. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-1 (List and Filter Repository Issues); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: View an Issue and Its Discussion
        steps:
        - keyword: GIVEN
          content: The user sees an Open issue in the issue list of an accessible repository; the issue has a title, description, one label, one assignee, and at least one comment.
        - keyword: WHEN
          content: The user clicks the issue number or title and scrolls through the discussion timeline.
        - keyword: THEN
          content: The detail page displays the repository-scoped issue number, title, Open status, description, label, assignee, comment author, and comment body, and displays creation and comment activities in chronological order.
        - keyword: THEN
          content: After refreshing or reopening the same number from the list, the same title, status, metadata, and saved comments are displayed; users without repository access cannot view the detail content.
  - id: REQ-5-2
    name: Issue Creation and Discussion
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: Supports creating issues in the current repository, editing titles and descriptions, and appending discussion comments. An issue title contains 1–256 non-empty characters after trimming leading and trailing whitespace; the description may be empty and is at most 65536 characters; a comment contains 1–65536 non-empty characters after trimming leading and trailing whitespace. After successful creation, the issue is assigned a unique repository-scoped number and the detail page opens; editing changes only the current fields of the target issue, while comments are appended to the activity timeline as independent records with author and timestamp. On insufficient permission, empty required fields, overlong input, or persistence failure, the system must not create an empty issue, overwrite the original description, or append a partial comment. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-5-2-1
      name: Create a Repository Issue
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: >-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        A signed-in user with Write, Maintain, or Admin clicks “New issue” from the current repository's Issues list page to open the creation form, enters a non-empty title and optional description, and submits. The system assigns an incrementing unique issue number within the repository, stores the repository identifier, title, description, author, creation time, and Open status, and appends a creation activity; on failure, it does not allocate a number or persist partial data. On success, the system redirects to the new issue detail page, and the list can locate the issue by its new number and status.


        Screenshot reference:

        ![image](reference/github-new-issue.png)
      scenarios:
      - name: Create an Issue from Repository, Comment, Code, Discussion, or Project Context
        steps:
        - keyword: GIVEN
          content: A signed-in user with issue-write permission opens the repository's “Issues” page; the current maximum issue number is known, and the candidate title is not currently used on the page.
        - keyword: WHEN
          content: The user clicks “New issue”, enters a title whose trimmed length is 1 to 256 and an optional description, then clicks “Submit new issue”.
        - keyword: THEN
          content: The system redirects to the new issue detail page, displaying a unique incrementing repository-scoped number, Open status, the entered title and description, and the current user as author; the activity timeline contains a creation record.
        - keyword: THEN
          content: After returning to the issue list, the item can be found by its new number; if the title is blank, exceeds 256 characters, the user lacks write permission, or submission fails, the system displays the reason and adds neither a new issue nor a new number.
    - id: REQ-5-2-2
      name: Edit an Issue Title and Description
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only a signed-in user with Write, Maintain, or Admin may click “Edit” beside the title or description on an issue detail page, modify the corresponding text, and click “Save”; Read and Triage may only view, their edit controls are unavailable, and the server rejects their submissions. The system updates only the title or description of the target issue and stores the editor, edit time, and new value, displaying the change in details, list summaries, and the activity timeline; for an empty title, overlong input, or save failure, the original value is retained. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Edit an Issue Title and Description
        steps:
        - keyword: GIVEN
          content: A signed-in user with edit permission opens the detail page of an issue that already has a title and description and records the issue number and original description.
        - keyword: WHEN
          content: The user clicks “Edit” beside the title, changes the title to a valid new value and saves, then clicks “Edit” beside the description, changes the description to a valid new value and saves.
        - keyword: THEN
          content: The title and description for the same issue number are updated, the issue-list summary displays the new title, and the activity timeline records the edits; other issues and this issue's status, labels, and assignees remain unchanged.
        - keyword: THEN
          content: After refreshing the detail page, the new values still exist; saving a blank title, input over the length limit, or a failed save retains the original value of the corresponding field.
      - name: Reject a Blank Issue Title Update
        steps:
        - keyword: GIVEN
          content: A user with edit permission opens an issue detail page whose title can be edited.
        - keyword: WHEN
          content: The user clears the title to a blank value and attempts to save.
        - keyword: THEN
          content: The system rejects the save, retains the original title, and continues to display the original title after reload.
    - id: REQ-5-2-3
      name: Comment on an Issue Discussion
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      - REQ-1-1-2
      description: Only a signed-in user with Write, Maintain, or Admin may enter a non-empty comment on the issue detail page of the current repository; all signed-in users who can view the issue may add or remove their own reactions on an existing issue or comment. The system stores the comment identifier, issue identifier, author, body, and creation time, or stores a “subject-target-reaction type” association; for the same user, target, and reaction, only one association is stored, and selecting it a second time removes it. On success, the new comment or reaction is displayed in the discussion and activity timeline; on failure, no local fake comment or partial reaction is displayed. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Comment on an Issue Discussion and Add a Reaction
        steps:
        - keyword: GIVEN
          content: A signed-in user with comment permission opens an issue detail page; the timeline already contains a comment to which a reaction can be added.
        - keyword: WHEN
          content: The user enters a non-empty trimmed comment in the comment box and clicks “Comment”, then selects a reaction from the reaction menu on the existing comment.
        - keyword: THEN
          content: The timeline appends a comment displaying the current user, comment body, and creation time; the target comment displays the reaction and its count, and the same user selecting the same reaction again does not create a duplicate reaction.
        - keyword: THEN
          content: After refreshing the detail page, the comment and reaction still exist; a blank comment, a comment exceeding 65536 characters, lack of comment permission, or publication failure does not append a partial comment or timeline record.
      - name: Reject a Blank Issue Comment
        steps:
        - keyword: GIVEN
          content: The user opens an issue discussion page where the comment box and submit button are visible.
        - keyword: WHEN
          content: The user enters only whitespace characters in the comment box and attempts to submit.
        - keyword: THEN
          content: The system creates no new comment or timeline record, and the discussion count remains unchanged after reload.
  - id: REQ-5-3
    name: Issue Metadata and Classification
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: An “Assignee” is an account assigned to follow up on an issue and is displayed on the right side of the detail page; it only stores an association between the issue and account and does not change that account's repository permission. A “Label” is a preconfigured classification name in the current repository and is displayed in the frontend as a label badge; it only stores an association between the issue and label. A “Milestone” is a preconfigured stage or version goal in the current repository and is displayed as single-select metadata on the right side; a work item may be associated with at most one milestone, and selecting None deletes that association. This version provides no page or interface for creating, editing, or deleting labels or milestones; test data and initial repositories must provide selectable items. Each relationship addition or removal updates the details and activity record and does not automatically create cross-repository labels, milestones, or membership relationships. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-5-3-1
      name: Assign or Unassign Issue Participants
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only a signed-in user with Triage, Maintain, or Admin may click the settings icon in the “Assignees” area on the right side of an issue, search for and check assignable members, or uncheck selected members and close the menu. Assignable members are accounts that have at least Triage permission on the current repository; the system stores the issue-account relationship, operator, and time and records an activity, while non-assignable users do not appear in results. Unassignment only deletes that issue relationship and does not delete the member account or repository grant; controls are unavailable to users without the role and the server rejects their submissions. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Assign or Unassign Issue Participants
        steps:
        - keyword: GIVEN
          content: A signed-in user with issue-maintenance permission opens an issue detail page; the repository contains one assignable member and one account outside the repository collaborator scope.
        - keyword: WHEN
          content: The user clicks the settings icon under “Assignees” on the right, searches for and checks the assignable member, closes the menu, then reopens it and unchecks that member.
        - keyword: THEN
          content: After the member is checked, that member appears in the assignee area and an assignment activity is recorded; after unassignment, the member is no longer displayed and an unassignment activity is recorded. Non-assignable accounts do not appear in search results, and unassignment does not delete the account.
        - keyword: THEN
          content: After refreshing the detail page, only the final selected-assignee set remains; users without maintenance permission cannot save assignee changes.
    - id: REQ-5-3-2
      name: Apply Labels to an Issue
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only users with Triage, Maintain, or Admin may apply or remove labels that already exist in the current repository; the system stores the issue-label relationship and activity record. The label selector must not create labels, display labels from other repositories, or associate labels from other repositories; Read and Write users may only view, the control is unavailable, and the server rejects their submissions. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Apply Labels to an Issue
        steps:
        - keyword: GIVEN
          content: A signed-in user with issue-maintenance permission opens an issue detail page; the current repository defines the `bug` and `documentation` labels, while another repository contains an external label with the same name.
        - keyword: WHEN
          content: The user opens the selector under “Labels” on the right, checks `bug`, saves, then reopens the selector and unchecks `bug`.
        - keyword: THEN
          content: After selection, the detail page and issue list display the `bug` label; after removal, it is no longer displayed. The selector offers only labels from the current repository and does not create or associate labels from another repository.
        - keyword: THEN
          content: After refreshing the page, the label set matches the last saved state; users without permission cannot submit label changes.
    - id: REQ-5-3-3
      name: Assign Issues and Pull Requests to a Milestone
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: >-
        On the right side of an issue or pull request, the user clicks the settings icon in the “Milestone” area and selects one item from the current repository's milestone list, or selects “None” to remove the association. The system stores the association between the work item and milestone and updates detail metadata; it does not create a cross-repository milestone.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
        Only users with Triage, Maintain, or Admin may use this capability on repository planning and issue-management pages; Read and Write users may only view the current milestone. The system validates the role and rejects unauthorized submissions.


        Screenshot reference:

        ![image](reference/github-milestones.png)
      scenarios:
      - name: Assign Issues and Pull Requests to a Milestone
        steps:
        - keyword: GIVEN
          content: A signed-in user with Triage, Maintain, or Admin opens an issue or pull-request detail page; the current repository contains a milestone named `v1.0`, while another repository contains a milestone that must not be selectable.
        - keyword: WHEN
          content: The user clicks the settings icon in “Milestone” on the right, selects `v1.0`, then reopens the selector and chooses “None”.
        - keyword: THEN
          content: After selection, the detail page displays `v1.0` and records an association activity; after selecting “None”, that display is removed. The selector does not offer milestones from other repositories and does not create cross-repository associations.
        - keyword: THEN
          content: After refreshing the detail page, the milestone state matches the last saved state; Read or Write users cannot save changes.
  - id: REQ-5-4
    name: Close or Reopen an Issue
    type: ATOMIC
    dependencies:
    - REQ-5-1-2
    description: Only users with Triage, Maintain, or Admin may close or reopen an issue from the issue detail view; Write and Read users may only view the status. The system stores the Open or Closed status, operator, and time, records the transition in activity history, and shows it to subsequent viewers; the status transition must not modify the title, description, comments, labels, assignees, or milestone. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: Close or Reopen an Issue
      steps:
      - keyword: GIVEN
        content: A signed-in user with issue-management permission opens an Open issue detail page that displays the number, title, and activity timeline.
      - keyword: WHEN
        content: The user clicks “Close issue”, confirms that the page displays Closed, and then clicks “Reopen issue”.
      - keyword: THEN
        content: The issue displays Closed and then Open status in sequence, and the timeline appends close and reopen events in sequence; the issue number, title, description, comments, and metadata do not change because of the status transitions.
      - keyword: THEN
        content: After refreshing the detail page and issue list, the final Open state remains consistent; for users without management permission, close or reopen operations are unavailable or rejected and the status does not change.
    - name: Prevent a User Without Issue-Management Permission from Closing an Issue
      steps:
      - keyword: GIVEN
        content: A signed-in user who can only view the issue and lacks issue-management permission opens the issue detail page.
      - keyword: WHEN
        content: The user attempts to close or reopen the issue.
      - keyword: THEN
        content: Close and reopen operations are unavailable to that user or are rejected, and the issue status remains unchanged.
- id: REQ-6
  name: Change Review and Merge Control
  type: FOLDER
  dependencies:
  - REQ-3-3
  - REQ-4-3
  description: A pull request (PR) is a persistent proposal to “merge code changes from the compare branch into the base branch”; it is not a branch, commit, or issue. The Pull requests page lists the current repository's PR number, title, author, source/target branches, and status; “New pull request” first opens the comparison page, where the user selects base (the target branch that receives the changes) and compare (the source branch that provides the changes) and inspects the diff. On the PR detail page, Conversation displays the title, description, ordinary comments, activities, and review summary; Commits displays commits on the compare branch relative to base; Files changed displays per-file, per-line differences; Checks displays check status for the PR's current compare commit. A PR's persisted status may only be Draft, Open, Closed, or Merged — normal creation produces Open, draft creation produces Draft, and the author or Maintain/Admin may mark a Draft as Ready for review to transition it to Open; the author or Maintain/Admin may transition an unmerged Open or Draft PR to Closed and may transition Closed back to Open; Merged is terminal and cannot be closed or reopened. Write, Maintain, and Admin may add inline comments and submit reviews, the author or Maintain/Admin may request reviewers, and only Maintain, Admin, or organization Owner may merge. Each PR stores a repository-scoped number, source/target branches, creation-time and current compare commits, creation-time base commit, title, description, author, status, and activity records. When the compare branch receives a new commit, the system updates the current compare commit, marks all existing review decisions as stale while preserving them in the timeline, recalculates merge eligibility, and retains inline comments at their original commit and line position marked Outdated. Failure does not change branches or PR state.
  children:
  - id: REQ-6-1
    name: Protect Branches with Review and Status-Check Requirements
    type: ATOMIC
    dependencies:
    - REQ-4-3-1
    - REQ-1-1-2
    description: >-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      A “branch protection rule” is a persistent merge restriction bound to one exact branch name, displayed in the frontend under Settings → Branches, with the backend storing the branch name and rule toggles. This product supports only two independently selectable requirements: “at least 1 valid Approve from someone other than the PR author” and “required check `test` is success”. For a given reviewer on the same current compare commit, only the reviewer's latest decision among Comment, Approve, and Request changes counts. The PR author cannot satisfy the approval requirement; any valid Request changes blocks merging; when the compare branch gains a new commit, all decisions become stale and a new review is required. “Checks” is the results area on the PR detail page attached to the current compare commit; the `test` status of pending, success, or failure, together with the setter and time, must be stored, and only a repository Admin may update that status from this area. The system blocks direct writes to a protected branch and applies the rule during subsequent PR merging.


      Screenshot reference:

      ![image](reference/github-branch-protection.png)
    scenarios:
    - name: Protect Branches with Review and Status-Check Requirements
      steps:
      - keyword: GIVEN
        content: A repository Admin is signed in and has opened “Settings” → “Branches”; the repository contains a `main` branch and an Open PR targeting `main`.
      - keyword: WHEN
        content: The Admin clicks “Add branch protection rule”, enters the exact branch name `main`, checks “Require 1 approval” and “Require status check test”, and clicks “Create” or “Save changes”; the Admin then updates `test` from pending to success in the PR's “Checks” area.
      - keyword: THEN
        content: 'The settings page displays exactly one rule for `main` with both requirements; the PR detail page persistently displays `test: success`, the setter, and time. A PR without 1 valid non-author approval, with any valid Request changes, or with `test` not equal to success is subsequently shown as unmergeable, and the protected branch cannot be directly updated to bypass the rule.'
      - keyword: THEN
        content: After refreshing the settings page, the rule still exists; a non-Admin either does not see a savable rule-editing entry or has the request rejected with the rule unchanged.
    - name: Prevent a Non-Administrator from Changing Branch Protection Rules
      steps:
      - keyword: GIVEN
        content: A signed-in user without repository-administration permission opens the branch-protection settings page.
      - keyword: WHEN
        content: The user attempts to create or modify a branch protection rule.
      - keyword: THEN
        content: Branch-protection controls are unavailable to the non-administrator or the operation is rejected, and no protection rule is saved.
    - name: Administrator Updates Pull-Request Check Status
      steps:
      - keyword: GIVEN
        content: A repository Admin opens the detail page of an Open PR targeting protected `main`; the Checks area shows `test` as pending for the PR's current compare commit.
      - keyword: WHEN
        content: The Admin updates `test` to success in the Checks area and saves.
      - keyword: THEN
        content: The Checks area displays success, the setter, and the update time; after refreshing the PR detail page, that status still corresponds to the same compare commit. If the compare branch gains a new commit, the new compare commit starts with pending, and success from the old commit cannot be used for merging.
  - id: REQ-6-2
    name: Pull Request Discovery and Creation
    type: FOLDER
    dependencies:
    - REQ-4-3
    description: Supports listing and filtering pull requests in the current repository, selecting source/target branches to view comparison results, and creating a normal or draft pull request from a valid comparison. Read may only view; Write, Maintain, and Admin may create PRs. Comparison results are temporary read-only context on the creation page; after successful creation, the system persists the source/target branches, current compare commit, creation-time base commit, title, description, author, and status, then opens the new pull-request detail page. Creation must be rejected without leaving a partial record when source and target are the same, there are no comparable commits, the same repository already has a Draft or Open PR with the same source/target pair, or the user lacks creation permission. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3 (Branch Management); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-6-2-1
      name: List and Filter Repository Pull Requests
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: >-
        The Pull requests list page only reads PR records from the current repository; each row displays the number, title, author, status, source branch, and target branch. Any user with repository-view permission may filter by Draft/Open/Closed/Merged status, author, or review status; filtering only affects the current list display and does not modify PRs, branches, or reviews.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.


        Screenshot reference:

        ![image](reference/github-pull-requests-list.png)
      scenarios:
      - name: List and Filter Repository Pull Requests
        steps:
        - keyword: GIVEN
          content: The user has opened the “Pull requests” page of an accessible repository; the list contains one Open PR created by `alice` and one Closed PR created by `alice`.
        - keyword: WHEN
          content: The user selects “Open” and filters the author to `alice`.
        - keyword: THEN
          content: The list displays only the Open PR and shows its number, title, source/target branches, author, and status; clicking the title opens that PR's detail page.
        - keyword: THEN
          content: After switching to “Closed”, the Open PR is not displayed; filtering does not change the status or review data of any PR.
    - id: REQ-6-2-2
      name: Compare Branches Before Opening a Pull Request
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: >-
        The PR comparison page is a read-only page shown before creation: base is the target branch that receives the merge result, and compare is the source branch that provides the changes to merge. A user with Write, Maintain, Admin, or organization Owner status clicks “New pull request” on the “Pull requests” page and selects the two branches; the system calculates comparable commits, changed files, and a diff summary based on the commits they currently point to. If the branches are the same or there is no difference, the creation entry is disabled; comparison does not save a PR, commit, or branch change.
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
        Only signed-in users with Write, Maintain, Admin, or organization Owner status may compare branches on the repository pull-request page; Read and Triage may view existing PRs but cannot enter the creation-comparison flow. The system validates the role and rejects unauthorized requests.


        Screenshot reference:

        ![image](reference/github-compare-branches.png)
      scenarios:
      - name: Compare Branches Before Opening a Pull Request
        steps:
        - keyword: GIVEN
          content: A signed-in user with Write, Maintain, Admin, or organization Owner status opens the “Pull requests” page; `feature/login` is one commit ahead of `main` and modifies one file.
        - keyword: WHEN
          content: The user clicks “New pull request”, selects `main` as base and `feature/login` as compare, and clicks “Compare changes”.
        - keyword: THEN
          content: The comparison page displays both branch names, at least one comparable commit, changed files, and a diff summary, and provides an enabled “Create pull request” entry.
        - keyword: THEN
          content: After changing compare to `main`, the page explains that the branches are the same or have no differences and disables the creation entry; this read-only comparison does not create a PR or modify branches.
      - name: Disable Pull Request Creation When Base and Compare Are the Same Branch
        steps:
        - keyword: GIVEN
          content: A collaborator opens the comparison view on a page where base and compare branches can be selected.
        - keyword: WHEN
          content: The collaborator selects the same branch for both base and compare and clicks Compare changes.
        - keyword: THEN
          content: The system explains that the two branches are the same or have no differences and keeps the pull-request creation entry disabled.
    - id: REQ-6-2-3
      name: Create a Pull Request from Comparison Results
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: A user with Write, Maintain, or Admin clicks “Create pull request” on a valid comparison-results page, enters a title containing 1–256 non-empty characters after trimming leading and trailing whitespace and an optional description of at most 65536 characters, confirms distinct base/compare branches with differences, and clicks “Create pull request”. The system atomically creates an Open PR, stores a unique repository-scoped number, source/target branches, current compare commit, current base commit, title, description, author, creation time, and activity record, and redirects to the detail page; if there is no difference, the branches are the same, a Draft or Open PR with the same source/target pair already exists, the title is empty or overlong, the user lacks permission, or submission fails, no record is created. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-2 (Compare Branches Before Opening a Pull Request); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Create a Pull Request from Comparison Results
        steps:
        - keyword: GIVEN
          content: A signed-in collaborator is on a valid comparison-results page for `main` and `feature/login`; the page displays at least one changed file, and no open PR currently exists for that comparison.
        - keyword: WHEN
          content: The user clicks “Create pull request”, enters a title 1 to 256 characters long and an optional description, confirms base as `main` and compare as `feature/login`, and submits.
        - keyword: THEN
          content: The system redirects to the new PR detail page, which displays a unique repository-scoped number, Open status, source/target branches, title, description, and the current user as author.
        - keyword: THEN
          content: After refreshing the detail page and PR list, the PR still exists; if the title is blank or overlong, the branches are the same, there is no difference, the user lacks creation permission, or persistence fails, no partial record is created.
    - id: REQ-6-2-4
      name: Create a Draft Pull Request
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: A user with Write, Maintain, or Admin completes a valid base/compare branch selection, clicks “Create draft pull request”, enters a valid title and optional description, and confirms creation. The system creates a PR in Draft state using the same persisted fields as a normal PR and displays a “Draft” marker; a draft cannot submit reviews or be merged. Only the author, Maintain, Admin, or organization Owner may click “Ready for review” on a Draft detail page to convert it to Open and record an activity; this transition does not change branches, commits, title, or number. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-2 (Compare Branches Before Opening a Pull Request); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Create a Draft Pull Request
        steps:
        - keyword: GIVEN
          content: A signed-in collaborator is on a valid comparison page for two distinct branches with differences and has permission to create a PR.
        - keyword: WHEN
          content: The user clicks “Create draft pull request”, enters a valid title and optional description, and confirms creation.
        - keyword: THEN
          content: The system creates a detail page displaying the “Draft” marker and source/target branches, and the PR list also shows draft status; the “Merge pull request” entry cannot be executed.
        - keyword: THEN
          content: After refresh, the draft status and content remain; if there is no valid difference or creation fails, no draft record is created.
      - name: Mark a Draft Pull Request as Ready for Review
        steps:
        - keyword: GIVEN
          content: The PR author is signed in and has opened the detail page of a Draft PR they created; the page displays the “Ready for review” button and no review has yet been submitted.
        - keyword: WHEN
          content: The author clicks “Ready for review” and confirms.
        - keyword: THEN
          content: The system saves the same PR number's status from Draft to Open, removes the Draft badge, and appends a status event in Conversation; after refresh and after reopening by a reviewer, the PR is shown as Open. This operation does not change the PR's branches, commits, title, or description.
  - id: REQ-6-3
    name: Pull Request Review Workspace
    type: FOLDER
    dependencies:
    - REQ-6-2-3
    description: Supports viewing the overview, commits, changed files, and diffs on a pull-request detail page, and adding review comments or submitting review decisions on specific files and line ranges in the diff. Read may view; users with Write, Maintain, or Admin who are not the PR author may comment on an Open PR and submit Comment, Approve, or Request changes; Draft does not allow review submission. An inline comment must store the target PR, compare commit, file path, line position, author, and body; a review decision must store the reviewer, current compare commit, status, and explanation. Each reviewer has only one effective decision on a given current compare commit; a new decision replaces the reviewer's effective decision while preserving history. Viewing operations are read-only, and if comment or review submission fails, it must not be displayed as published. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-3 (Create a Pull Request from Comparison Results); it must reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-6-3-1
      name: View Pull Request Overview and Commits
      type: ATOMIC
      dependencies:
      - REQ-6-2-3
      description: The PR detail page is the unified read view for the same PR number. Conversation is the timeline for the author's description, ordinary comments, review summaries, and status events; Commits is the list of commits on the PR's current compare branch relative to base; Files changed is the entry point to the current diff. Users with repository-view permission can switch among the three tabs; all read the same persisted PR, branch, and commit data and do not create comments, reviews, or merges. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-3 (Create a Pull Request from Comparison Results); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: View Pull Request Overview and Commits
        steps:
        - keyword: GIVEN
          content: A reviewer sees an Open PR in the PR list of an accessible repository; the PR has a title, description, at least one commit, and one discussion comment.
        - keyword: WHEN
          content: The reviewer clicks the PR title and opens the “Conversation”, “Commits”, and “Files changed” tabs in sequence.
        - keyword: THEN
          content: Conversation displays the title, description, base/compare branches, and discussion; Commits displays the commits for the PR; Files changed displays the change summary; all three refer to the same PR number.
        - keyword: THEN
          content: After refreshing any tab, the PR title, branches, and commits remain unchanged; viewing operations do not create comments, reviews, or branch updates.
    - id: REQ-6-3-2
      name: Inspect Changed Files and Aggregate Diff
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      description: Files changed is the read-only diff view on a PR detail page computed from the current base and compare commits. Each diff block displays the file path and added/deleted lines; aggregate statistics show the current PR's number of changed files and added/deleted line counts. Users with repository-view permission may expand files or navigate to lines, but this operation does not modify files, commits, branches, comments, or review status. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-3-1 (View Pull Request Overview and Commits); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Inspect Changed Files and Aggregate Diff
        steps:
        - keyword: GIVEN
          content: The user has opened an accessible PR detail page whose comparison contains one added file and one modified file.
        - keyword: WHEN
          content: The user clicks “Files changed”, selects the modified file, and expands its diff block.
        - keyword: THEN
          content: The page displays the PR's changed file paths, added/deleted lines for each file, and aggregate statistics; unchanged files are not displayed, and the diff corresponds to the current source/base commits.
        - keyword: THEN
          content: After refreshing or switching back to Conversation, the files, PR status, and review status remain unchanged; users without permission to view a private PR cannot obtain its diff content.
    - id: REQ-6-3-3
      name: Add Review Comments to Changed Code Lines
      type: ATOMIC
      dependencies:
      - REQ-6-3-2
      - REQ-1-1-2
      description: An inline review comment is a comment record anchored to a file path, the current compare commit, and a specific added/deleted line in Files changed; it differs from an ordinary comment in Conversation that has no code location. A user with Write, Maintain, or Admin who is not the PR author can hover over a changed line, click “+”, and choose “Add single comment” to publish immediately or “Start a review” to keep it as a pending review draft. The system stores the PR, file path, compare commit, line position, author, body, and publication state; when the compare commit changes, published comments are retained but marked Outdated, while drafts are not published automatically. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-3-2 (Inspect Changed Files and Aggregate Diff) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Add Review Comments to Changed Code Lines
        steps:
        - keyword: GIVEN
          content: A signed-in reviewer opens the “Files changed” page of a PR they are allowed to comment on and locates an added code line and its file path.
        - keyword: WHEN
          content: The reviewer hovers over the added line and clicks “+”, enters a non-empty inline comment, and selects “Add single comment”.
        - keyword: THEN
          content: Conversation and the diff page immediately display the comment; the comment record is associated with the current PR, file path, diff commit, and target line position and displays the reviewer and body.
        - keyword: THEN
          content: After refresh, the comment remains anchored to that file and line; when “Start a review” is selected, the comment remains pending and is not public until the review is submitted, while an empty comment or failed submission does not display a partial comment.
      - name: Keep an Inline Comment Pending When Starting a Review
        steps:
        - keyword: GIVEN
          content: The reviewer locates a changed line in the pull request's Files changed view.
        - keyword: WHEN
          content: The reviewer enters an inline comment and selects Start a review instead of Add single comment.
        - keyword: THEN
          content: The system keeps the comment in a pending state, does not publish it immediately, and displays it only after the review is submitted.
    - id: REQ-6-3-4
      name: Submit a Pull Request Review
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      - REQ-1-1-2
      description: A user who is not the PR author and has Write, Maintain, or Admin may submit Comment, Approve, or Request changes on an Open PR; the author and Draft PRs cannot submit reviews. The system stores the review decision, reviewer, current compare commit, optional explanation, and time; a new decision by the same reviewer replaces that reviewer's effective decision for the current commit while preserving the old record. Approve is valid only when the reviewer is not the author and the compare commit is still the same; Request changes blocks merging until that reviewer submits a new Comment or Approve for the current compare commit, or the compare branch receives a new commit that makes the old decision stale. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-3-1 (View Pull Request Overview and Commits) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: Submit a Pull Request Review
        steps:
        - keyword: GIVEN
          content: A signed-in reviewer opens an Open PR that can be reviewed, and the PR currently has no “Approved” decision from that reviewer.
        - keyword: WHEN
          content: The reviewer clicks “Review changes” under “Files changed”, enters an overall comment, selects “Approve”, and clicks “Submit review”.
        - keyword: THEN
          content: Conversation and the review summary on the right display the reviewer, Approved status, overall comment, and time; branch-protection merge-eligibility checks can read this decision.
        - keyword: THEN
          content: After refresh, the decision still exists; selecting “Request changes” displays the corresponding status, while a user without review permission or a failed submission does not persist a decision.
      - name: Record a Request-Changes Review Decision
        steps:
        - keyword: GIVEN
          content: A reviewer opens a pull request that can be reviewed.
        - keyword: WHEN
          content: The reviewer enters review feedback, selects Request changes, and submits the review.
        - keyword: THEN
          content: The system saves the review comment and changes requested status and continues to display the decision after reload.
  - id: REQ-6-4
    name: Request or Remove Pull Request Reviewers
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: A “reviewer request” is a pending-review relationship between a PR and a candidate reviewer account, displayed in the Reviewers area on the right side of the PR detail page; it is not the same as a submitted review decision. The author of an Open or Draft PR, Maintain, Admin, or organization Owner may create or delete this relationship. A candidate reviewer must have Write, Maintain, or Admin on the repository and must not be the PR author; the system stores or deletes the “PR-reviewer request” relationship together with the operator and time. Removing a request does not delete reviews, comments, or activity records already submitted by that user and does not change the user's effective review decision. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-3 (Create a Pull Request from Comparison Results) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: Request or Remove Pull Request Reviewers
      steps:
      - keyword: GIVEN
        content: The PR author or a maintainer is signed in and has opened an Open PR detail page; the repository contains a collaborator who is eligible to be requested as a reviewer.
      - keyword: WHEN
        content: The user searches for and selects the collaborator under “Reviewers” on the right, saves, and then clicks the remove button beside that collaborator.
      - keyword: THEN
        content: After selection, the account is shown on the right as a requested reviewer; after removal, the request disappears; this does not automatically generate an approval or comment.
      - keyword: THEN
        content: After refreshing the detail page, only the final request set remains; a user who is neither the author nor a maintainer cannot modify requests.
  - id: REQ-6-5
    name: Merge an Eligible Pull Request
    type: ATOMIC
    dependencies:
    - REQ-6-3-4
    - REQ-6-1
    description: “Merge” is the only write operation that writes the current compare commit's changes from an Open PR into the base branch; it is not simply marking the PR as complete. Only Maintain, Admin, or organization Owner may merge from the PR detail page using the sole supported “Create a merge commit” method; the merge confirmation area should display satisfied and unsatisfied conditions. Before confirmation, the system rereads the target branch head, current compare commit, merge-conflict state, and protection rules — if the target is protected, there must be 1 valid non-author Approve for the current compare commit, there must be no valid Request changes, and `test` must be success; if the target is unprotected, only absence of merge conflicts is required. After validation succeeds, the system atomically creates a merge commit whose parents are the target-branch head at merge time and the current compare commit, updates the target-branch head, sets the PR to Merged, and stores the merger, time, and resulting commit identifier. If any condition is unsatisfied or persistence fails, neither the target branch nor PR changes; Merged is terminal. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-3-4 (Submit a Pull Request Review) and REQ-6-1 (Protect Branches with Review and Status-Check Requirements); it must reuse that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: Merge an Eligible Pull Request
      steps:
      - keyword: GIVEN
        content: A signed-in user with Maintain, Admin, or organization Owner status opens an Open, non-draft PR; its target `main` branch is protected, it has 1 valid non-author Approve for the current compare commit, `test` is success in Checks, and the current diff has no merge conflict.
      - keyword: WHEN
        content: The maintainer confirms that the only selectable method on the page is “Create a merge commit”, clicks “Merge pull request”, and clicks “Confirm merge” in the confirmation box.
      - keyword: THEN
        content: The PR displays Merged, the merger, time, and resulting commit identifier; the `main` branch head is updated to the merge result, and the PR's source- and target-branch content is integrated according to the selected merge method.
      - keyword: THEN
        content: After refreshing the PR and `main` branch, the merged status and resulting commit remain; if the PR is a draft, lacks approval, has a failed check, is unmergeable, or the user lacks permission, the merge entry is disabled or rejected and the target branch and PR state remain unchanged.
  - id: REQ-6-6
    name: Close or Reopen a Pull Request Without Merging
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: When the proposed change should not proceed, the PR author, Maintain, Admin, or organization Owner may close an unmerged Open or Draft PR without merging; the same roles may reopen a Closed PR as Open. The system stores the status, operator, and time and records the transition, while keeping the PR discussion, reviews, diff, and branch references viewable; closing or reopening must not update any branch. Merged is terminal, the page does not display close or reopen operations, and the server rejects status changes. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-6-2-3 (Create a Pull Request from Comparison Results) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: Close or Reopen a Pull Request Without Merging
      steps:
      - keyword: GIVEN
        content: The PR author or a maintainer is signed in and has opened an unmerged Open PR that has a title, discussion, and source/target branches.
      - keyword: WHEN
        content: The user clicks “Close pull request”, confirms that the status is Closed, and then clicks “Reopen pull request”.
      - keyword: THEN
        content: The PR displays Closed and Open in sequence, and the timeline records both status transitions; closing does not merge commits, update the target branch, or delete the discussion or diff.
      - keyword: THEN
        content: After refreshing the detail page, the final Open status and original discussion remain; a viewer who is neither the author nor a maintainer cannot close or reopen the PR, and the PR status remains unchanged.
    - name: Prevent a Non-Author and Non-Maintainer from Closing a Pull Request
      steps:
      - keyword: GIVEN
        content: A signed-in viewer who is neither the pull-request author nor a maintainer opens the protected pull request.
      - keyword: WHEN
        content: The viewer attempts to find a close or reopen operation, or attempts to change the pull-request status.
      - keyword: THEN
        content: Close and reopen operations are unavailable to that user or are rejected, and the pull-request status remains unchanged.
data:
  - category: Account and Permission Seed Data
    items:
    - The system contains verified accounts that can be used to sign in by username or verified email, recover access through a verified email, change passwords, and sign out from protected pages.
    - Local password-recovery tests do not depend on email, SMS, external authenticators, reset URLs, or environment variables. Each test case creates an independent account through the registration page; after submitting the email, the recovery page directly displays the fixed verification code `123456` and the password-reset form. Tests use the incorrect code `000000` to verify rejection and `123456` to verify success.
    - Except for the unique accounts, organizations, repositories, issues, comments, files, and PR titles created through the registration page in each run, the role accounts, page URLs, visible names, branch names, commit text, labels, milestones, and check states required by GitHub tests are all seed data defined under the categories of this `data` field in the local test environment. Test configuration only passes these defined values into the browser; it does not call APIs, read the database, access the real GitHub, email, or any other external service. Any test case that writes to a seeded object restores the initial state described here before the next execution.
    - The system contains verified accounts with the roles of organization Owner, organization Member, repository Read, Triage, Write, Maintain, Admin, pull-request author, non-author reviewer, and no-repository-access user.
    - The system contains protected account, organization, repository, issue, and pull-request pages used to verify that direct access after sign-out requires re-authentication.
  - category: Organization and Repository Seed Data
    items:
    - The system contains a public organization with at least one public repository visible to visitors and at least one private repository invisible to unauthorized visitors.
    - The system contains an organization manageable by an organization Owner and includes a removable Member, a second Owner, teams, candidate team members, and nested teams suitable for validating membership and hierarchy relationships. For REQ-2-2-3, an independent registered account that is not a member before each run (`E2E_ORGANIZATION_NEW_MEMBER_*`), an account that is already a member (`E2E_ORGANIZATION_EXISTING_MEMBER_*`), and a private repository URL for that organization that is not directly or indirectly granted to either account (`E2E_ORGANIZATION_UNGRANTED_PRIVATE_REPOSITORY_URL`) are provided separately; before every test run, the membership/authorization state of all three is restored, and accounts that will be written by other membership tests must not be shared.
    - The system contains public and private repositories with distinct names for repository search, public-repository viewing, clone-URL copying, and visibility filtering.
    - The system contains a repository managed by seeded accounts for access grants, role changes, visibility changes, default-branch changes, branch protection, file changes, and pull-request flows; the repository has non-author approvals, valid and failed `test` check states, and a branch capable of producing a new compare commit. Branch-protection creation tests use a dedicated repository or branch pattern (`E2E_PROTECTION_REPOSITORY_URL`, `E2E_PROTECTED_BRANCH_PATTERN`) for which no same-named rule exists before the run; check-status tests use a dedicated Open PR targeting protected `main` (`E2E_PROTECTION_PULL_REQUEST_URL`), whose current compare commit initially has `test` pending and is restored to that state before each run.
    - The system contains a source repository that can be forked by a seeded user and an identifiable fork that has already been created.
  - category: Code, Branch, and Commit Seed Data
    items:
    - The system contains a code repository with browsable directories, known file names, visible file content, searchable code text, and a search term that returns no results.
    - The system contains a repository commit history with at least one visible commit message and commit author.
    - The system contains a commit detail page with changed files and enough diff content to inspect added and deleted lines.
    - The system contains a branch repository with the current active branch, another switchable branch, a file that exists only on the target branch, and a query term that matches no branch.
    - The system contains a repository with an old default branch and a candidate new default branch; an administrator can change the default branch, while a non-administrator cannot.
    - The system contains a branch-protection repository and branch-name pattern that an administrator can configure, while a non-administrator cannot modify the protection rule.
  - category: Issue Seed Data
    items:
    - The system contains an issue list with at least one Open issue title and one Closed issue title for filtering.
    - The system contains an issue detail page with a stable title and description viewable by visitors or authorized users.
    - The system contains issues for editing, invalid-edit validation, commenting, comment validation, assignment, labeling, milestone setting, closing, and protected access, for use in issue-editing, comment, metadata, and state-transition tests.
    - The system contains issue assignees, labels, and milestones selectable from the corresponding issue controls.
  - category: Pull Request Seed Data
    items:
    - The system contains a pull-request list with at least one Open pull-request title for filtering.
    - The system contains branch-comparison data for creating pull requests, including a valid base branch, compare branch, changed files, a no-difference comparison, a normal compare URL, and a draft compare URL.
    - For the draft-to-ready-for-review test, a dedicated author account (`E2E_DRAFT_PR_AUTHOR_*`) and its Draft PR URL, title, source branch, and target branch (`E2E_DRAFT_PULL_REQUEST_URL`, `E2E_DRAFT_PULL_REQUEST_TITLE`, `E2E_DRAFT_PULL_REQUEST_SOURCE_BRANCH`, `E2E_DRAFT_PULL_REQUEST_TARGET_BRANCH`) are provided separately. Before each test, this PR is Draft, has no submitted reviews, and is not shared with the draft-creation test; the test environment must restore its state after the test case or before the next start.
    - The system contains pull-request detail pages for overview viewing, public changed-file inspection, inline review comments, pending review comments, review submission, request-changes review submission, reviewer assignment, merging, unmergeable validation, close/reopen, and protected close/reopen permission validation.
    - The system contains a reviewer username that can be used for pull-request reviewer-request tests.
